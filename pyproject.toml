[project]
name = "docmint"
version = "0.1.0"
description = "Medical study toolkit for NotebookLM, OCR, PDF conversion, and Obsidian"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "groq",
    "notebooklm-py",
    "Pillow",
    "pypdf",
    "PyMuPDF",
    "python-dotenv",
    "pyspellchecker",
    "yt-dlp",
]
