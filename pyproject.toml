[project]
name = "docmint"
version = "0.1.0"
description = "Medical study toolkit for NotebookLM, OCR, PDF conversion, and Obsidian"
requires-python = ">=3.11"
dependencies = [
    "groq",
    "gemini-webapi",
    "notebooklm-py",
    "Pillow",
    "pypdf",
    "pymupdf",
    "python-dotenv",
    "pyspellchecker",
    "yt-dlp",
    "openai>=3.58.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
