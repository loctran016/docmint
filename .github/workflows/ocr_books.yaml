name: OCR books (Gemini)

on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Chỉ xử lý sách có tên file chứa chuỗi này (để trống = tất cả)'
        required: false
        default: ''
        type: string
      pages:
        description: 'Chỉ xử lý các trang này, ví dụ 1-50,60 (để trống = tất cả)'
        required: false
        default: ''
        type: string
      model:
        description: 'Model, cách nhau dấu phẩy (để trống = biến GEMINI_MODEL hoặc mặc định của script)'
        required: false
        default: ''
        type: string
      pages_per_req:
        description: 'Số trang gộp mỗi request (1, 2 hoặc 3)'
        required: false
        default: '2'
        type: choice
        options: ['1', '2', '3']
  schedule:
    # 08:15 UTC = 15:15 giờ Việt Nam, ngay sau khi quota ngày của Google AI Studio reset
    - cron: '15 8 * * *'

permissions:
  contents: write

# Không cho hai lần chạy cùng lúc (tránh đụng checkpoint và xung đột git)
concurrency:
  group: ocr-books
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GH_TOKEN: ${{ github.token }}
      IN_BOOK: ${{ github.event.inputs.book }}
      IN_PAGES: ${{ github.event.inputs.pages }}
      IN_MODEL: ${{ github.event.inputs.model }}
      IN_PPR: ${{ github.event.inputs.pages_per_req }}
    steps:
      - name: Checkout (code + checkpoint output_md/.pages từ các lần trước)
        uses: actions/checkout@v7

      - name: Tải PDF từ GitHub Release (tag pdfs-input)
        run: |
          mkdir -p input_pdfs
          gh release download pdfs-input --dir input_pdfs --pattern "*.pdf" --clobber
          ls -la input_pdfs

      - name: Cài uv
        uses: astral-sh/setup-uv@v10

      - name: Chạy OCR (dừng êm sau 5 giờ 40 phút)
        run: |
          ARGS=(input_pdfs --max-runtime 20400 --pages-per-req "${IN_PPR:-2}")
          [ -n "$IN_BOOK" ]  && ARGS+=(--book "$IN_BOOK")
          [ -n "$IN_PAGES" ] && ARGS+=(--pages "$IN_PAGES")
          [ -n "$IN_MODEL" ] && ARGS+=(--model "$IN_MODEL")
          uv run process_book.py "${ARGS[@]}"

      - name: Lưu tiến độ về repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f vì .gitignore của toolkit bỏ qua output_md/ trên máy cá nhân
          git add -f output_md/
          if git diff --cached --quiet; then
            echo "Không có thay đổi để lưu."
            exit 0
          fi
          git commit -m "chore(ocr): update progress [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "Push lần $i thất bại, thử lại sau 5 giây..."
            sleep 5
          done
          echo "Không push được tiến độ."
          exit 1
