name: Medical Video Transcribe (Groq Whisper + Gemini)

# Luồng mới: yt-dlp tải audio -> ffmpeg nén/cắt -> Groq Whisper -> Gemini làm sạch thuật ngữ -> artifact.
# Bản Faster-Whisper cũ nằm ở transcribe_faster_whisper.yml.
# Secrets: GROQ_API_KEYS, GEMINI_API_KEYS (cách nhau dấu phẩy); tuỳ chọn YT_COOKIES_TXT (nội dung cookies.txt của
# tài khoản Google PHỤ) nếu YouTube chặn IP của GitHub hoặc video ở chế độ Không công khai.

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'Link video hoặc playlist YouTube y khoa'
        required: true
        type: string
      lang:
        description: 'Ngôn ngữ chính (vi hoặc en)'
        required: true
        default: 'vi'
        type: string
      force_whisper:
        description: '(Cũ, không còn tác dụng) giữ lại để lệnh gh workflow run cũ không lỗi'
        type: boolean
        default: false
      upgrade_stt:
        description: 'Bỏ cache cũ và chép lại audio'
        type: boolean
        default: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: ${{ github.event.inputs.youtube_url }}
      VIDEO_LANG: ${{ github.event.inputs.lang }}
      UPGRADE: ${{ github.event.inputs.upgrade_stt }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (JS runtime cho yt-dlp)
        uses: denoland/setup-deno@v2

      - name: Install ffmpeg, yt-dlp, google-genai
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip yt-dlp google-genai python-dotenv

      - name: Ghi cookies.txt từ secret (nếu có)
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            printf '%s' "$YT_COOKIES_TXT" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Transcribe (Groq Whisper + Gemini)
        run: |
          ARGS=(--url "$VIDEO_URL" --lang "$VIDEO_LANG" --out transcript_out)
          [ "$UPGRADE" = "true" ] && ARGS+=(--upgrade-stt)
          python input/transcripts/get_medical_transcript.py "${ARGS[@]}"

      - name: Xóa cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/cookies.txt"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: medical-transcript
          path: transcript_out/*.md
          if-no-files-found: error
