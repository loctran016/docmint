name: Medical Audio Transcribe (Groq Whisper + Gemini)

# Audio được tải lên một GitHub Release trước; workflow chỉ nén/cắt -> Groq Whisper -> Gemini -> artifact.
# Secrets: GROQ_API_KEYS, GEMINI_API_KEYS (cách nhau dấu phẩy).

on:
  workflow_dispatch:
    inputs:
      audio_release:
        description: "Tag GitHub Release chứa các file audio đã tải ở máy local"
        required: true
        type: string
      audio_pattern:
        description: "Glob chọn audio trong Release (ví dụ *.m4a hoặc *.mp3)"
        required: true
        default: "*.m4a"
        type: string
      lang:
        description: "Ngôn ngữ chính (vi hoặc en)"
        required: true
        default: "vi"
        type: string
      force_whisper:
        description: "(Cũ, không còn tác dụng) giữ lại để lệnh gh workflow run cũ không lỗi"
        type: boolean
        default: false
      upgrade_stt:
        description: "Bỏ cache cũ và chép lại audio"
        type: boolean
        default: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VIDEO_LANG: ${{ github.event.inputs.lang }}
      UPGRADE: ${{ github.event.inputs.upgrade_stt }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Restore transcript cache
        uses: actions/cache@v4
        with:
          path: .cache/transcripts
          key: transcript-cache-${{ github.run_id }}
          restore-keys: |
            transcript-cache-

      - name: Download audio from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIO_RELEASE: ${{ github.event.inputs.audio_release }}
          AUDIO_PATTERN: ${{ github.event.inputs.audio_pattern }}
        run: |
          mkdir -p audio_input
          gh release download "$AUDIO_RELEASE" --pattern "$AUDIO_PATTERN" --dir audio_input --clobber
          find audio_input -type f -print -quit | grep -q . || {
            echo "::error::Không tìm thấy file audio trong Release."
            exit 1
          }

      - name: Install ffmpeg and google-genai
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          pip install --upgrade pip google-genai python-dotenv

      - name: Transcribe (Groq Whisper + Gemini)
        run: |
          shopt -s nullglob
          files=(audio_input/*)
          for audio in "${files[@]}"; do
            case "$audio" in
              *.m4a|*.mp3|*.wav|*.ogg|*.opus|*.webm)
                ARGS=(--audio "$audio" --lang "$VIDEO_LANG" --out transcript_out)
                [ "$UPGRADE" = "true" ] && ARGS+=(--upgrade-stt)
                python src/ingest/transcripts/get_medical_transcript.py "${ARGS[@]}"
                ;;
            esac
          done
          compgen -G 'transcript_out/*.md' >/dev/null || {
            echo "::error::Release không chứa định dạng audio được hỗ trợ."
            exit 1
          }

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-transcript
          path: transcript_out/*.md
          if-no-files-found: error
