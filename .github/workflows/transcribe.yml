name: Medical Video Transcribe (Groq Whisper + Gemini)

# Luồng mới: yt-dlp tải audio -> ffmpeg nén/cắt -> Groq Whisper -> Gemini làm sạch thuật ngữ -> artifact.
# Bản Faster-Whisper cũ nằm ở transcribe_faster_whisper.yml.
# Secrets: GROQ_API_KEYS, GEMINI_API_KEYS (cách nhau dấu phẩy); tuỳ chọn YT_COOKIES_TXT (nội dung cookies.txt của
# tài khoản Google PHỤ) nếu YouTube chặn IP của GitHub hoặc video ở chế độ Không công khai.

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Link video hoặc playlist YouTube y khoa"
        required: true
        type: string
      lang:
        description: "Ngôn ngữ chính (vi hoặc en)"
        required: true
        default: "vi"
        type: string
      force_whisper:
        description: "(Cũ, không còn tác dụng) giữ lại để lệnh gh workflow run cũ không lỗi"
        type: boolean
        default: false
      upgrade_stt:
        description: "Bỏ cache cũ và chép lại audio"
        type: boolean
        default: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: ${{ github.event.inputs.youtube_url }}
      VIDEO_LANG: ${{ github.event.inputs.lang }}
      UPGRADE: ${{ github.event.inputs.upgrade_stt }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Deno (JS runtime cho yt-dlp)
        uses: denoland/setup-deno@v2

      - name: Restore transcript cache
        uses: actions/cache@v4
        with:
          path: .cache/transcripts
          key: transcript-cache-${{ github.run_id }}
          restore-keys: |
            transcript-cache-

      - name: Install ffmpeg, yt-dlp, google-genai
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | sudo tar -xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          pip install --upgrade pip "yt-dlp[default]" google-genai python-dotenv

      - name: Ghi cookies.txt từ secret (nếu có)
        run: |
          if [ -n "$YT_COOKIES_TXT" ]; then
            TRIMMED="${YT_COOKIES_TXT#"${YT_COOKIES_TXT%%[![:space:]]*}"}"
            TRIMMED="${TRIMMED//$'\r'/}"
            TRIMMED="${TRIMMED//$'\xef\xbb\xbf'/}"
            if [[ "$TRIMMED" == "# Netscape HTTP Cookie File"* ]] || [[ "$TRIMMED" == "# HTTP Cookie File"* ]]; then
              printf '%s\n' "$TRIMMED" | tr -d '\r' > "$RUNNER_TEMP/cookies.txt"
            else
              printf '%s' "$TRIMMED" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/cookies.txt"
            fi
            test -s "$RUNNER_TEMP/cookies.txt"
            if ! awk 'BEGIN { cookies=0 } !/^#/ && NF >= 7 { cookies=1 } END { exit(cookies ? 0 : 1) }' "$RUNNER_TEMP/cookies.txt"; then
              echo "::error::YT_COOKIES_TXT is not a valid Netscape cookies.txt file."
              rm -f "$RUNNER_TEMP/cookies.txt"
              exit 1
            fi
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Transcribe (Groq Whisper + Gemini)
        run: |
          ARGS=(--url "$VIDEO_URL" --lang "$VIDEO_LANG" --out transcript_out)
          [ "$UPGRADE" = "true" ] && ARGS+=(--upgrade-stt)
          python input/transcripts/get_medical_transcript.py "${ARGS[@]}"

      - name: Xóa cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/cookies.txt"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-transcript
          path: transcript_out/*.md
          if-no-files-found: error
