name: Medical Video Transcribe (Faster-Whisper, bản cũ)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'Link video YouTube y khoa'
        required: true
        type: string
      lang:
        description: 'Ngôn ngữ chính (vi hoặc en)'
        required: true
        default: 'vi'
        type: string
      force_whisper:
        description: 'Bắt buộc dùng Whisper (bỏ qua phụ đề sẵn có)'
        type: boolean
        default: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: ${{ github.event.inputs.youtube_url }}
      VIDEO_LANG: ${{ github.event.inputs.lang }}
      FORCE: ${{ github.event.inputs.force_whisper }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install --upgrade pip yt-dlp

      # Tuỳ chọn: nếu YouTube chặn IP của GitHub ("Sign in to confirm you're not a bot"),
      # tạo secret YT_COOKIES chứa nội dung file cookies.txt (định dạng Netscape).
      - name: Prepare cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "COOKIES_ARG=--cookies cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Get video title
        run: |
          TITLE=$(yt-dlp $COOKIES_ARG --skip-download --print title "$VIDEO_URL" | head -n1 || true)
          echo "VIDEO_TITLE=$TITLE" >> "$GITHUB_ENV"

      - name: Try downloading existing subtitles
        id: check_subs
        run: |
          if [ "$FORCE" = "false" ]; then
            yt-dlp $COOKIES_ARG --write-sub --write-auto-sub --sub-lang "$VIDEO_LANG" --sub-format vtt --skip-download -o "sub" "$VIDEO_URL" || true
          fi
          if ls sub*.vtt 1> /dev/null 2>&1; then
            echo "has_subs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_subs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build markdown from subtitles
        if: steps.check_subs.outputs.has_subs == 'true'
        run: python src/ingest/transcripts/build_transcript.py subs

      - name: Cache HuggingFace models
        if: steps.check_subs.outputs.has_subs == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-whisper-turbo

      - name: Download audio and run Faster-Whisper
        if: steps.check_subs.outputs.has_subs == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install faster-whisper
          yt-dlp $COOKIES_ARG -x --audio-format mp3 --audio-quality 5 -o "audio.%(ext)s" "$VIDEO_URL"
          python src/ingest/transcripts/build_transcript.py whisper

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: medical-transcript
          path: transcript_out/*.md
          if-no-files-found: error
